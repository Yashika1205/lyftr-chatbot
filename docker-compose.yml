services:
  backend:
    build: ./backend
    image: lyftr-chatbot-backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CACHE_DIR: /data/llm_cache
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - chat_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: lyftr-chatbot-frontend
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chat_data:
